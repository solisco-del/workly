<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Workly – Hire freelancers & find work</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <div class="bar">
        <div class="logo" id="logo" role="link" tabindex="0">workly</div>
        <nav id="nav"></nav>
        <div class="seg" role="group" aria-label="Account type">
          <button data-role="freelancer">Freelancer</button
          ><button data-role="client">Client</button>
        </div>
        <div id="acct" class="row" style="gap: 8px; align-items: center"></div>
      </div>
    </header>
    <main id="main"></main>
    <footer>Workly · accounts and data are stored on the server.</footer>
    <div id="toast" role="status"></div>
    <script src="/js/core.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/views.js"></script>
    <script src="/js/messages.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
